<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environment Choices</title>
    <link rel="stylesheet" href="styles/loadingStyle.css">
    <link rel="stylesheet" href="styles/style.css">
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            var p = localStorage.getItem('palette');
            if (t) document.documentElement.setAttribute('data-theme', t);
            else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
            if (p) document.documentElement.setAttribute('data-palette', p);
        })();
    </script>
</head>

<body>
    <div id="loadingPage">
        <div id="loadIcon">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <script>
            window.addEventListener('load', function () {
                setTimeout(() => {
                    const loadingPage = document.getElementById('loadingPage');
                    loadingPage.classList.add('fade-out');

                    const loaded = document.getElementById('loaded');
                    if (loaded) {
                        loaded.style.display = 'block';
                    }
                    setTimeout(() => {
                        loadingPage.style.display = 'none';
                    }, 500);
                }, 2000);
            });
        </script>
    </div>
    <div id="bg-gradient" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div id="loaded">
        <div id="developmentWarning" style="padding-top: 40dvh; padding-bottom: 10rem">
            <hr>
            <h3 style="text-align: center; color:hsl(0, 100%, 47%);">This page is under construction</h3>
            <h3 style="text-align: center; color: hsl(59, 100%, 50%)">Come back soon to see new features!</h3>
            <hr>
            <input type="button" value="Return to Home Page" class="btn" style="display: block; margin: auto; margin-top: 2rem;" onclick="location.href='../../index.html'" />
        </div>
        <script type="module">
            import { Card } from "./assets/card.js";
            let cardTest = new Card("Test Card", "https://picsum.photos/200/300", "This is a test card to see if the card class works");
            document.body.appendChild(cardTest.generateCard());
        </script>
        <footer id="licenseInfo">
            <p>Licensed under MIT License</p>
            <p>Created on Github Timothy-Wallis</p>
            <p>Any distribution of this software must include this license information</p>
            <p>Version info: 1.1.0</p>
            <p>Further breakdown of version info can be viewed on Github</p>
        </footer>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Simulator</title>
    <link rel="stylesheet" href="sources/html pages/styles/loadingStyle.css">
    <link rel="stylesheet" href="sources/html pages/styles/style.css">
    <link rel="favicon" href="sources/html pages/icons/icon.png">
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            var p = localStorage.getItem('palette');
            if (t) document.documentElement.setAttribute('data-theme', t);
            else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
            if (p) document.documentElement.setAttribute('data-palette', p);
        })();
    </script>
</head>
<body>
    <div id="loadingPage">
        <div id="loadIcon">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <script>
            window.addEventListener('load', function () {
                setTimeout(() => {
                    var loadingPage = document.getElementById('loadingPage');
                    loadingPage.classList.add('fade-out');

                    let loaded = document.getElementById('loaded');
                    if (loaded) {
                        loaded.style.display = 'block';
                    }
                    setTimeout(() => {
                        loadingPage.style.display = 'none';
                    }, 500);
                }, 2000);
            });
        </script>
    </div>
    <div id="bg-gradient" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div id="loaded">
        <h1 style="margin: auto; text-align: center;">Ecosystem Simulator</h1>
        <hr>
        <div style="margin: auto; text-align: center; padding-bottom: 1rem; padding-top: 15rem;">
            <h3 style="margin: auto; text-align: center; padding-bottom: 1rem; text-decoration: underline; padding-bottom: 1.5rem;">Select a simulation to run</h3>
            <input type="button" value="Progression Simulation" class="btn" onclick="location.href='../sources/html pages/evolutionarytraitsim.html'" />
            <input type="button" value="Environment Choices" class="btn" onclick="location.href='../sources/html pages/enviornmentchoices.html'" />
        </div>
        <footer id="licenseInfo" style="position: fixed; bottom: 0; width: 100%;">
            <p>Licensed under MIT License</p>
            <p>Created on Github Timothy-Wallis</p>
            <p>Any distribution of this software must include this license information</p>
            <p>Version info: 1.1.0</p>
            <p>Further breakdown of version info can be viewed on Github</p>
        </footer>
    </div>
</body>
</html>
